spring.application.name=UniMarket
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# ---------------------------------------------------------------------------
# Database
# The local developer default matches the user's MySQL installation.
# Override DB_USERNAME, DB_PASSWORD, or DB_URL for another environment.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unimarket?createDatabaseIfNotExist=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA
# ddl-auto=update is a temporary development convenience while the entity model
# is still growing. Before deployment this becomes 'validate' with Flyway
# migrations owning the schema, as recorded in the design document.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Reject misspelled or unsupported request fields instead of silently ignoring
# them. This is especially important for the credential-free payment contract.
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
security.jwt.audience=${JWT_AUDIENCE:unimarket-api}

security.jwt.secret=${UNIMARKET_JWT_SECRET}
unimarket.security.access-token-ttl=PT15M
unimarket.security.refresh-token-ttl=P7D
unimarket.security.refresh-cookie-name=unimarket_rt
# Must be true in any deployed environment. False only for local plain HTTP.
unimarket.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
unimarket.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
unimarket.security.max-failed-login-attempts=5
unimarket.security.lockout-duration=PT15M
unimarket.security.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.example.unimarket=INFO

# Evidence-backed institution policies are maintained as data, not as a global
# domain suffix allowlist. Override the resource for another deployment if needed.
unimarket.identity.institution-policy-resource=${INSTITUTION_POLICY_RESOURCE:classpath:institution-email-policies.psv}

# Explicit, one-time local bootstrap. Disabled unless all values are supplied.
unimarket.bootstrap.admin-enabled=${UNIMARKET_BOOTSTRAP_ADMIN_ENABLED:false}
unimarket.bootstrap.admin-email=${UNIMARKET_ADMIN_EMAIL:}
unimarket.bootstrap.admin-password=${UNIMARKET_ADMIN_PASSWORD:}
unimarket.bootstrap.admin-first-name=${UNIMARKET_ADMIN_FIRST_NAME:UniMarket}
unimarket.bootstrap.admin-last-name=${UNIMARKET_ADMIN_LAST_NAME:Administrator}

# Expensive orders use simulated escrow; no real funds are held or transferred.
unimarket.escrow.threshold-zar=${UNIMARKET_ESCROW_THRESHOLD_ZAR:5000.00}

# Checkout holds reserve sellable stock but never decrement physical quantity.
unimarket.inventory-reservation.ttl=${INVENTORY_RESERVATION_TTL:PT15M}
unimarket.inventory-reservation.expiry-enabled=${INVENTORY_RESERVATION_EXPIRY_ENABLED:true}
unimarket.inventory-reservation.expiry-sweep-delay=${INVENTORY_RESERVATION_EXPIRY_SWEEP_DELAY:PT1M}
unimarket.inventory-reservation.expiry-initial-delay=${INVENTORY_RESERVATION_EXPIRY_INITIAL_DELAY:PT1M}
unimarket.inventory-reservation.expiry-batch-size=${INVENTORY_RESERVATION_EXPIRY_BATCH_SIZE:25}

# ---------------------------------------------------------------------------
# User-uploaded marketplace media
# Keep generated files outside the packaged application. Production can point
# this at a persistent mounted volume.
# ---------------------------------------------------------------------------
unimarket.media.upload-dir=${UNIMARKET_MEDIA_UPLOAD_DIR:./uploads}
unimarket.media.max-image-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
