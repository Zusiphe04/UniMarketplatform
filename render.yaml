services:
  - type: web
    name: community-store-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: UNIMARKET_JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        value: community-store-api
      - key: FRONTEND_ORIGINS
        sync: false
      - key: REFRESH_COOKIE_SECURE
        value: true
      - key: REFRESH_COOKIE_SAME_SITE
        value: None
      - key: JPA_DDL_AUTO
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: 5
      - key: DB_INITIALIZATION_FAIL_TIMEOUT_MS
        value: 60000
      - key: DB_VALIDATION_TIMEOUT_MS
        value: 5000
      - key: UNIMARKET_MEDIA_UPLOAD_DIR
        value: /var/data/uploads
      - key: UNIMARKET_BOOTSTRAP_ADMIN_ENABLED
        value: false
      - key: UNIMARKET_ADMIN_EMAIL
        sync: false
      - key: UNIMARKET_ADMIN_PASSWORD
        sync: false
      - key: UNIMARKET_ADMIN_FIRST_NAME
        value: Platform
      - key: UNIMARKET_ADMIN_LAST_NAME
        value: Administrator
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    disk:
      name: community-store-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
